apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/johnthunderr/turiba-devops-labs/api:8deeee9383398af15dd13212cf85cb9d69fb034b
          ports:
            - containerPort: 5000
